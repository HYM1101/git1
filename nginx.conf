# ── nginx 站点配置（与概要设计 6.4 多端集成方案对齐） ──
# PC 端（Vue3）部署在 /；大屏（React）部署在 /screen；后端网关在 /api

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip（配合 vite-plugin-compression 的 .gz 产物）
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── PC 端（Vue Router history 模式） ──
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源长缓存（文件名含 hash）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # ── 大屏（demo4-standalone React，独立 dist 目录） ──
    location /screen {
        alias /usr/share/nginx/html/screen;
        try_files $uri $uri/ /screen/index.html;
    }

    # ── 后端网关反代 ──
    location /api {
        proxy_pass http://backend-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 安全头（等保三级基线）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
